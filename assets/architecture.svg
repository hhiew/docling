<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="760" viewBox="0 0 1180 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="engineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="llmGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="outGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="1180" height="760" rx="20" fill="url(#bgGrad)"/>

  <!-- ============ 输入层 ============ -->
  <text x="60" y="52" fill="#e2e8f0" font-size="17" font-weight="700">📥 输入层</text>
  <g font-size="13" fill="#dbeafe" text-anchor="middle">
    <rect x="60" y="70" width="106" height="40" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="113" y="95">PDF</text>
    <rect x="180" y="70" width="150" height="40" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="255" y="95">Word / PPT / Excel</text>
    <rect x="344" y="70" width="150" height="40" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="419" y="95">HTML / MD / AsciiDoc</text>
    <rect x="508" y="70" width="140" height="40" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="578" y="95">EML / CSV / TXT</text>
    <rect x="662" y="70" width="170" height="40" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="747" y="95">图片 PNG/JPEG/WEBP…</text>
  </g>
  <text x="850" y="95" fill="#64748b" font-size="12">共 12 种格式</text>

  <!-- 输入 → 引擎 -->
  <line x1="440" y1="112" x2="440" y2="152" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 解析引擎层 ============ -->
  <text x="60" y="146" fill="#7dd3fc" font-size="17" font-weight="700">⚙️ 解析引擎层 · 纯 Go 单二进制</text>
  <rect x="60" y="164" width="880" height="150" rx="16" fill="url(#engineGrad)" opacity="0.16"/>
  <rect x="60" y="164" width="880" height="150" rx="16" fill="none" stroke="#0e7490" stroke-width="1.5"/>

  <g font-size="14" fill="#e0f2fe" text-anchor="middle">
    <rect x="84" y="192" width="360" height="96" rx="12" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.2"/>
    <text x="264" y="222" font-size="15" font-weight="700" fill="#7dd3fc">规则引擎</text>
    <text x="264" y="246">版面切分 · 表格结构还原 · 多栏阅读顺序</text>
    <text x="264" y="268">字体 / CMap 乱码恢复 · 跨页续表合并</text>

    <rect x="470" y="192" width="220" height="96" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="580" y="220" font-size="14" font-weight="700" fill="#7dd3fc">internal/pdfenc</text>
    <text x="580" y="242" font-size="12.5">ToUnicode/CMap/SFNT</text>
    <text x="580" y="262" font-size="12.5">JPEG2000 · JBIG2 · 软蒙版</text>

    <rect x="712" y="192" width="204" height="96" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="814" y="220" font-size="14" font-weight="700" fill="#7dd3fc">internal/ooxml</text>
    <text x="814" y="242" font-size="12.5">Strict → Transitional</text>
    <text x="814" y="262" font-size="12.5">命名空间归一化</text>
  </g>
  <text x="960" y="240" fill="#64748b" font-size="12" text-anchor="middle">可选</text>
  <rect x="935" y="252" width="130" height="36" rx="9" fill="none" stroke="#475569" stroke-dasharray="5 4"/>
  <text x="1000" y="275" fill="#94a3b8" font-size="12.5" text-anchor="middle">docling-serve</text>

  <!-- 引擎 → 模型 -->
  <line x1="440" y1="316" x2="440" y2="388" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="452" y="358" fill="#7dd3fc" font-size="12">结构化解析</text>

  <!-- ============ 大模型旁路 ============ -->
  <rect x="700" y="342" width="400" height="120" rx="16" fill="url(#llmGrad)" opacity="0.18"/>
  <rect x="700" y="342" width="400" height="120" rx="16" fill="none" stroke="#9333ea" stroke-width="1.6"/>
  <text x="720" y="374" fill="#d8b4fe" font-size="16" font-weight="700">🧠 大模型旁路 · 按页路由</text>
  <g font-size="13" fill="#ede9fe" text-anchor="middle">
    <rect x="724" y="392" width="160" height="46" rx="10" fill="#2e1065" stroke="#a855f7"/>
    <text x="804" y="412">OCRHook</text>
    <text x="804" y="430" font-size="11.5" fill="#c4b5fd">逐字文本识别</text>
    <rect x="904" y="392" width="172" height="46" rx="10" fill="#2e1065" stroke="#a855f7"/>
    <text x="990" y="412">PDFVisualHook</text>
    <text x="990" y="430" font-size="11.5" fill="#c4b5fd">结构化 bbox JSON</text>
  </g>
  <text x="900" y="458" fill="#a78bfa" font-size="11.5" text-anchor="middle">质量信号:扫描件 · 乱码 · 图片表格 · 公式密集 · 栏位歧义</text>

  <!-- 引擎 ⇄ LLM 双向 -->
  <path d="M 944 314 C 1000 330 940 340 906 346" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowPurple)"/>
  <path d="M 736 466 Q 600 540 452 502" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowPurple)"/>
  <text x="640" y="556" fill="#c084fc" font-size="11.5" text-anchor="middle">疑难页送模型 · 强校验后几何合并 · 失败保留纯 Go 结果</text>

  <!-- ============ 统一模型 ============ -->
  <text x="60" y="428" fill="#e2e8f0" font-size="17" font-weight="700">📋 统一文档模型</text>
  <rect x="60" y="446" width="380" height="112" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="250" y="480" fill="#f8fafc" font-size="18" font-weight="700" text-anchor="middle">DoclingDocument</text>
  <text x="250" y="506" fill="#94a3b8" font-size="12.5" text-anchor="middle">官方协议 schema 1.10.0 · 无损往返</text>
  <g fill="#7dd3fc" font-size="12" text-anchor="middle">
    <text x="250" y="534">texts · tables · pictures · groups · furniture · pages</text>
  </g>

  <!-- 模型 → 输出 -->
  <line x1="250" y1="560" x2="250" y2="608" stroke="#86efac" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ 输出层 ============ -->
  <text x="60" y="600" fill="#86efac" font-size="17" font-weight="700">📤 输出层</text>
  <rect x="60" y="618" width="1070" height="110" rx="16" fill="url(#outGrad)" opacity="0.14"/>
  <rect x="60" y="618" width="1070" height="110" rx="16" fill="none" stroke="#15803d" stroke-width="1.5"/>
  <g font-size="13.5" text-anchor="middle">
    <rect x="88" y="646" width="200" height="52" rx="11" fill="#052e16" stroke="#22c55e"/>
    <text x="188" y="668" fill="#bbf7d0" font-weight="700">Markdown / HTML</text>
    <text x="188" y="688" fill="#86efac" font-size="11.5">图表内嵌 SVG + 可检索表格</text>
    <rect x="318" y="646" width="210" height="52" rx="11" fill="#052e16" stroke="#22c55e"/>
    <text x="423" y="668" fill="#bbf7d0" font-weight="700">Docling JSON</text>
    <text x="423" y="688" fill="#86efac" font-size="11.5">官方协议无损导出</text>
    <rect x="558" y="646" width="210" height="52" rx="11" fill="#052e16" stroke="#22c55e"/>
    <text x="663" y="668" fill="#bbf7d0" font-weight="700">content_list</text>
    <text x="663" y="688" fill="#86efac" font-size="11.5">RAG 检索扁平内容列表</text>
    <rect x="798" y="646" width="300" height="52" rx="11" fill="#052e16" stroke="#22c55e"/>
    <text x="948" y="668" fill="#bbf7d0" font-weight="700">三种分块器</text>
    <text x="948" y="688" fill="#86efac" font-size="11.5">Hierarchical / Hybrid / 知识库分块</text>
  </g>

  <!-- 底部注脚 -->
  <text x="590" y="756" fill="#475569" font-size="12.5" text-anchor="middle">纯 Go 生产基线,零 Python · 零外部服务 · 大模型可选增强</text>
</svg>
